name: Test

on:
  pull_request:
  push:
    branches: [main]

# Every run resets the same Neon test branch, so runs must never overlap.
# Queued runs wait instead of cancelling one that is mid-reset.
concurrency:
  group: neon-test-database
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Repository secrets. A pull request from a fork gets none of them, so its run fails at setup.
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      TEST_EDITOR_EMAIL: ${{ secrets.TEST_EDITOR_EMAIL }}
      TEST_EDITOR_PASSWORD: ${{ secrets.TEST_EDITOR_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - name: Integration tests
        run: pnpm test:int

      # Playwright drives the Google Chrome preinstalled on the runner (channel: "chrome").
      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
