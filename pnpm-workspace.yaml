allowBuilds:
  esbuild: true
  # sharp ships prebuilt binaries (@img/sharp-*) for macOS and Linux, including
  # Linux musl for Docker, so its install script, which only compiles from source, stays off.
  sharp: false
  unrs-resolver: false
overrides:
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  dompurify@<=3.4.15: ^3.4.16
  esbuild@<=0.24.2: ^0.25.0
